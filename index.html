<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Layer Canvas</title>
  <style>
    :root { color-scheme: dark; --bg:#1d1f22; --panel:#292b2e; --panel2:#33363a; --line:#44474b; --text:#e4e5e7; --muted:#a4a8ad; --blue:#4da8ff; --blue2:#245783; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    button,input { font:inherit; }
    button { color:inherit; cursor:pointer; }
    button:disabled { opacity:.37; cursor:default; }
    button:focus-visible,input:focus-visible { outline:2px solid var(--blue); outline-offset:1px; }
    .app { display:flex; flex-direction:column; height:100dvh; min-height:380px; }
    .top { position:relative; min-height:54px; display:flex; align-items:center; gap:10px; padding:6px 14px; background:#26282b; border-bottom:1px solid #101113; box-shadow:0 1px 0 #393b3e; z-index:2; }
    .top > button { height:36px; min-height:36px; border-radius:4px; }
    .brand { display:flex; align-items:center; gap:9px; min-width:195px; padding:0; border:0; background:transparent; font-weight:650; white-space:nowrap; text-align:left; }
    .brand:hover { color:#a9d9ff; }
    .ps { display:grid; place-items:center; width:31px; height:31px; color:#80c8ff; background:#112a40; border:1px solid #235781; font-size:18px; font-weight:650; letter-spacing:-1px; }
    .brand small { display:block; color:#a9adb3; font-weight:400; font-size:10px; }
    .spacer { flex:1; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid #505358; border-radius:4px; background:#383a3e; padding:7px 11px; min-height:33px; white-space:nowrap; }
    .btn:hover:not(:disabled) { background:#484b50; }
    .btn.primary { background:#23628e; border-color:#368dcc; color:white; font-weight:650; }
    .btn.primary:hover { background:#3079ab; }
    .btn.icon { width:32px; padding:0; font-size:17px; }
    .btn.subtle { background:transparent; border-color:transparent; }
    .btn.subtle:hover { background:#404348; }
    .project-menu { position:absolute; top:calc(100% + 4px); right:8px; width:200px; z-index:8; padding:5px; background:#303337; border:1px solid #62666c; border-radius:6px; box-shadow:0 8px 24px #000a; }
    .project-menu[hidden] { display:none; }
    .project-menu button { width:100%; min-height:40px; padding:8px 10px; text-align:left; border:0; border-radius:4px; background:transparent; }
    .project-menu button:hover { background:#48505a; }
    .ratio-menu { position:absolute; top:calc(100% + 4px); left:8px; z-index:8; width:216px; padding:5px; background:#303337; border:1px solid #62666c; border-radius:6px; box-shadow:0 8px 24px #000a; }
    .ratio-menu[hidden],.custom-size[hidden] { display:none; }
    .ratio-menu > button { display:block; width:100%; min-height:36px; padding:6px 10px; border:0; border-radius:4px; background:transparent; text-align:left; }
    .ratio-menu > button:hover { background:#48505a; }
    .custom-size { display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:7px 5px 4px; border-top:1px solid #51555b; }
    .custom-size label { color:#bdc4cb; font-size:11px; }
    .custom-size input { width:100%; min-width:0; margin-top:3px; padding:6px; border:1px solid #62666c; border-radius:3px; background:#1c2024; color:white; }
    .custom-size button { grid-column:1/-1; min-height:31px; border:1px solid #448dc2; border-radius:4px; background:#235477; }
    .project-dots { display:none; }
    .workspace { display:flex; min-height:0; flex:1; }
    .center { display:flex; flex-direction:column; flex:1; min-width:0; background:#202124; }
    .stage { flex:1; min-height:0; overflow:auto; background:#202124; }
    .stage.dragging { box-shadow:inset 0 0 0 3px var(--blue); }
    .stage-inner { min-width:100%; min-height:100%; width:max-content; display:grid; place-items:center; padding:30px; }
    .board { position:relative; flex:none; background-color:#fff; background-image:linear-gradient(45deg,#d0d2d5 25%,transparent 25%),linear-gradient(-45deg,#d0d2d5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d0d2d5 75%),linear-gradient(-45deg,transparent 75%,#d0d2d5 75%); background-size:20px 20px; background-position:0 0,0 10px,10px -10px,-10px 0; box-shadow:0 1px 22px #000b,0 0 0 1px #111; touch-action:none; cursor:default; }
    #canvas { display:block; width:100%; height:100%; pointer-events:none; }
    .selection { display:none; position:absolute; border:1px solid var(--blue); box-shadow:0 0 0 1px #0e3044; pointer-events:none; }
    .selection::before { content:""; position:absolute; inset:-1px; border:1px solid #ffffff88; pointer-events:none; }
    .selection.locked { border-style:dashed; border-color:#c45d66; }
    .selection.locked .handle { display:none; }
    .snap-guide { display:none; position:fixed; z-index:4; pointer-events:none; filter:drop-shadow(0 0 2px #062a44); }
    .snap-guide.vertical { width:2px; background:repeating-linear-gradient(to bottom,#6ed4ff 0 6px,transparent 6px 11px); }
    .snap-guide.horizontal { height:2px; background:repeating-linear-gradient(to right,#6ed4ff 0 6px,transparent 6px 11px); }
    .handle { position:absolute; width:11px; height:11px; background:#e4f4ff; border:1px solid #1475b9; box-shadow:0 1px 3px #000b; pointer-events:auto; touch-action:none; }
    .handle[data-handle="nw"] { top:-6px; left:-6px; cursor:nwse-resize; }
    .handle[data-handle="ne"] { top:-6px; right:-6px; cursor:nesw-resize; }
    .handle[data-handle="sw"] { bottom:-6px; left:-6px; cursor:nesw-resize; }
    .handle[data-handle="se"] { bottom:-6px; right:-6px; cursor:nwse-resize; }
    .side { width:266px; flex:none; display:flex; flex-direction:column; background:var(--panel); border-left:1px solid #101113; min-height:0; }
    .layers-panel { display:flex; flex-direction:column; flex:0 1 auto; min-height:0; max-height:calc(100dvh - 110px); }
    .section-title { height:37px; flex:none; display:flex; align-items:center; gap:8px; border-bottom:1px solid #191a1b; padding:0 14px; font-weight:650; }
    .section-title small { color:var(--muted); font-weight:400; }
    .layers { overflow-y:auto; overflow-x:hidden; flex:0 1 auto; min-height:0; scrollbar-width:thin; scrollbar-color:#717982 #292b2e; }
    .layer-drop-line { display:none; position:fixed; z-index:9; height:2px; background:#60bcff; box-shadow:0 0 5px #155e98; pointer-events:none; }
    .layer-drop-line::before,.layer-drop-line::after { content:""; position:absolute; top:50%; width:6px; height:6px; border-radius:50%; background:#60bcff; transform:translateY(-50%); }
    .layer-drop-line::before { left:-3px; }
    .layer-drop-line::after { right:-3px; }
    .layer-drop-line.vertical::before,.layer-drop-line.vertical::after { left:50%; right:auto; transform:translateX(-50%); }
    .layer-drop-line.vertical::before { top:-3px; }
    .layer-drop-line.vertical::after { top:auto; bottom:-3px; }
    .empty { margin:22px 15px; color:#aeb2b7; line-height:1.6; }
    .layer { position:relative; display:flex; align-items:center; gap:7px; padding:8px 8px; border-bottom:1px solid #202224; min-height:57px; cursor:pointer; }
    .layer,.layer * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
    .layer[draggable="true"] { cursor:grab; }
    .layer.dragging { opacity:.45; }
    .layer:hover { background:#383a3e; }
    .layer.selected { background:#33536d; box-shadow:inset 3px 0 var(--blue); }
    .mini { display:grid; place-items:center; width:25px; min-width:25px; height:28px; border:1px solid #505961; border-radius:4px; background:#30353a; color:#b9c2c9; padding:0; }
    .mini:hover { background:#444d54; color:#f3f7fa; }
    .mini.is-visible,.mini.is-unlocked { background:#256447; border-color:#3d9b6a; color:#d4ffe6; }
    .mini.is-hidden,.mini.is-locked { background:#7b3036; border-color:#c45d66; color:#ffe1e3; }
    .mini svg { display:block; width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
    .thumb { width:34px; height:36px; display:grid; place-items:center; flex:none; overflow:hidden; border:1px solid #64676b; background:conic-gradient(#c8c8c8 25%,white 0 50%,#c8c8c8 0 75%,white 0) 0 0/12px 12px; }
    .thumb img { max-width:100%; max-height:100%; object-fit:contain; }
    .layer-name { min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; touch-action:manipulation; }
    .layer-name small { display:block; color:#bec4c9; font-size:10px; }
    .rename-input { width:100%; min-width:0; padding:3px 5px; border:1px solid var(--blue); border-radius:3px; outline:0; background:#19232d; color:white; font-size:16px; }
    .rename-input { -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; touch-action:auto; }
    .mobile-layer-ghost { position:fixed; z-index:12; pointer-events:none; opacity:.9; background:#33536d; border:1px solid var(--blue); border-radius:4px; box-shadow:0 8px 22px #0009; }
    .adjustments-title { min-height:40px; background:#303337; border-top:1px solid #151618; }
    .properties { display:none; flex:none; max-height:min(460px,65dvh); overflow:auto; }
    .side.expanded .properties { display:block; }
    .properties-footer { padding:0 12px 12px; display:flex; flex-direction:column; gap:9px; }
    .oprow { display:flex; align-items:center; gap:9px; color:#b6bac0; }
    .oprow input { flex:1; min-width:0; accent-color:var(--blue); }
    .oprow output { min-width:45px; text-align:right; color:#e2e8ed; font-variant-numeric:tabular-nums; }
    .props-buttons { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:5px; }
    .props-buttons .btn { padding:6px 2px; font-size:11px; }
    .transform-caption { display:flex; align-items:center; justify-content:space-between; min-height:20px; color:#aeb7bf; font-size:11px; }
    .transform-slider { font-size:12px; }
    .transform-slider > span { min-width:18px; }
    #aspectLock { min-height:26px; padding:2px 8px; font-size:11px; }
    #aspectLock.is-active { background:#235477; border-color:#448dc2; color:#e5f4ff; }
    #aspectLock svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    #editToggle { margin-left:auto; min-height:28px; min-width:64px; padding:2px 8px; font-size:12px; }
    .mobile-only { display:none; }
    .toast { position:fixed; left:50%; bottom:50px; z-index:9; transform:translateX(-50%); max-width:min(90vw,470px); padding:10px 15px; background:#15191e; border:1px solid #54728d; border-radius:5px; box-shadow:0 5px 22px #000a; color:white; text-align:center; opacity:0; pointer-events:none; transition:opacity .18s; }
    .toast.show { opacity:1; }
    .copy-fallback { display:none; position:fixed; inset:0; z-index:10; align-items:center; justify-content:center; padding:14px; background:#000c; }
    .copy-fallback.open { display:flex; }
    .copy-card { display:flex; flex-direction:column; gap:9px; width:min(420px,100%); max-height:90dvh; padding:14px; background:#292b2e; border:1px solid #60656b; border-radius:9px; box-shadow:0 12px 40px #000c; }
    .copy-card strong { font-size:15px; }
    .copy-card p { margin:0; color:#c5c9cf; font-size:12px; line-height:1.5; }
    .copy-preview { display:grid; place-items:center; min-height:130px; max-height:54dvh; overflow:hidden; background:conic-gradient(#bdbfc3 25%,#ececec 0 50%,#bdbfc3 0 75%,#ececec 0) 0 0/18px 18px; }
    .copy-preview img { display:block; max-width:100%; max-height:54dvh; object-fit:contain; -webkit-touch-callout:default; user-select:auto; }
    .copy-card .btn { width:100%; }
    input[type=file] { display:none; }
    @media(max-width:760px) {
      .top { flex-wrap:nowrap; gap:4px; padding:3px 6px; min-height:0; }
      .top .spacer { display:none; }
      .brand { justify-content:center; font-size:12px; border:1px solid #505358; background:#383a3e; }
      .brand .ps,.brand small,.brand .canvas-word { display:none; }
      .top #undo,.top #redo { display:none; }
      .top .brand,.top #addImage,.top #copy,.top #save,.top #projectMenuButton { flex:1 1 0; width:0; min-width:0; height:33px; min-height:33px; padding:0 2px; font-size:12px; }
      .project-label { display:none; }
      .project-dots { display:inline; font-size:20px; line-height:12px; }
      .workspace { flex-direction:column; }
      .center { min-height:170px; }
      .stage-inner { padding:7px 8px; }
      .side { width:100%; height:auto; max-height:calc(min(46dvh,390px,calc(100dvh - 230px)) + env(safe-area-inset-bottom)); flex:0 0 auto; flex-direction:column; overflow:hidden; border-left:0; border-top:1px solid #161719; padding-bottom:env(safe-area-inset-bottom); }
      .side.expanded { height:calc(min(25dvh,210px,calc(100dvh - 260px)) + env(safe-area-inset-bottom)); max-height:none; }
      .layers-panel { height:49px; flex:none; max-height:none; min-height:0; }
      .section-title { height:25px; padding:0 9px; }
      .mobile-only { display:inline-flex; }
      .adjustments-title { height:32px; min-height:32px; }
      #editToggle { margin-left:0; min-height:26px; padding:2px 7px; font-size:11px; }
      #mobileUndo { margin-left:auto; }
      .history-button { width:28px; min-height:26px; height:26px; flex:none; padding:0; font-size:17px; }
      .layers { display:flex; align-items:center; gap:5px; flex:1 1 auto; height:49px; max-height:none; overflow-x:auto; overflow-y:hidden; min-width:0; min-height:0; padding:3px 8px; scrollbar-width:none; scrollbar-gutter:auto; }
      .layers::-webkit-scrollbar { display:none; }
      .layer { flex:0 0 160px; width:160px; height:42px; min-height:0; padding:3px; gap:5px; margin:0; border:1px solid #484b50; border-radius:4px; touch-action:pan-x; }
      .layer.renaming { flex:0 0 100%; width:100%; border-color:var(--blue); }
      .layer.renaming .thumb,.layer.renaming .mini { display:none; }
      .layer.renaming .layer-name { flex:1; }
      .layer.renaming .rename-input { height:34px; padding:4px 9px; }
      .custom-size input { font-size:16px; }
      .layer .mini { width:22px; min-width:22px; height:29px; padding:0; }
      .layer .mini svg { width:16px; height:16px; }
      .layer.locked { border-color:#c45d66; }
      .thumb { width:29px; height:32px; }
      .layer-name { font-size:11px; }
      .layer-name small { font-size:9px; }
      .empty { white-space:nowrap; font-size:12px; margin:0; }
      .empty br { display:none; }
      .properties { display:none; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; min-height:0; }
      .side.expanded .properties { display:block; flex:1; }
      .properties-footer { padding:5px 9px 8px; gap:4px; }
      .properties .btn { min-height:27px; padding:2px 6px; }
      .props-buttons .btn { min-height:29px; }
      .handle { width:19px; height:19px; }
      .handle[data-handle="nw"] { top:-10px; left:-10px; }
      .handle[data-handle="ne"] { top:-10px; right:-10px; }
      .handle[data-handle="sw"] { bottom:-10px; left:-10px; }
      .handle[data-handle="se"] { bottom:-10px; right:-10px; }
      .toast { bottom:calc(90px + env(safe-area-inset-bottom)); }
    }
    @media(max-width:380px) { .top { gap:3px; } }
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="brand" id="ratioMenuButton" aria-expanded="false" aria-controls="ratioMenu" title="Tap for sizes · double-tap to swap orientation"><b class="ps">Ps</b><span><span id="ratioLabel">9:16</span><span class="canvas-word"> Canvas</span><small id="canvasSizeLabel">Transparent PNG · 1080 × 1920</small></span></button>
    <button class="btn subtle" id="undo" title="Undo Ctrl/⌘ Z">↶ Undo</button>
    <button class="btn subtle" id="redo" title="Redo Ctrl/⌘ Shift Z">↷ Redo</button>
    <button class="btn action" id="addImage">＋ Upload</button>
    <button class="btn" id="projectMenuButton" aria-expanded="false" aria-controls="projectMenu" aria-label="More tools"><span class="project-label">Project</span><span class="project-dots" aria-hidden="true">⋯</span></button>
    <div class="spacer"></div>
    <button class="btn action" id="copy" title="Copy full canvas PNG">Copy</button>
    <button class="btn primary action" id="save">Save</button>
    <div class="project-menu" id="projectMenu" hidden><button id="addEmpPreset">＋ EMP LOGO preset</button><button id="exportProject">Export JSON project</button><button id="importProject">Import JSON project</button></div>
    <div class="ratio-menu" id="ratioMenu" hidden><button data-ratio="9:16">9:16 · 1080 × 1920</button><button data-ratio="3:4">3:4 · 1080 × 1440</button><button data-ratio="1:1">1:1 · 1080 × 1080</button><button id="customRatioButton">Custom size…</button><div class="custom-size" id="customSize" hidden><label>Width<input type="number" id="customWidth" min="100" max="6000" inputmode="numeric"></label><label>Height<input type="number" id="customHeight" min="100" max="6000" inputmode="numeric"></label><button id="applyCustomSize">Apply size</button></div></div>
  </header>
  <div class="workspace">
    <div class="center">
      <div class="stage" id="stage"><div class="stage-inner" id="stageInner"><div class="board" id="board"><canvas id="canvas" width="1080" height="1920"></canvas><div class="selection" id="selection"><i class="handle" data-handle="nw"></i><i class="handle" data-handle="ne"></i><i class="handle" data-handle="sw"></i><i class="handle" data-handle="se"></i></div><div class="snap-guide vertical" id="guideV" aria-hidden="true"></div><div class="snap-guide vertical" id="guideV2" aria-hidden="true"></div><div class="snap-guide horizontal" id="guideH" aria-hidden="true"></div><div class="snap-guide horizontal" id="guideH2" aria-hidden="true"></div></div></div></div>
    </div>
    <aside class="side">
      <div class="layers-panel">
        <div class="layers" id="layers"><p class="empty">Upload an image to start</p></div>
      </div>
      <div class="section-title adjustments-title">Adjustments<button class="btn mobile-only history-button" id="mobileUndo" title="Undo" aria-label="Undo">↶</button><button class="btn mobile-only history-button" id="mobileRedo" title="Redo" aria-label="Redo">↷</button><button class="btn" id="editToggle" aria-expanded="false" aria-controls="propertiesPanel" aria-label="Expand adjustments" title="Expand adjustments">Open ⌄</button></div>
      <div class="properties" id="propertiesPanel">
        <div class="properties-footer">
          <div class="props-buttons"><button class="btn" id="moveUp" title="Move layer up">↑ Up</button><button class="btn" id="moveDown" title="Move layer down">↓ Down</button><button class="btn" id="centerLayer">Center</button><button class="btn" id="deleteLayer">Delete</button></div>
          <label class="oprow transform-slider"><span>Width</span><input type="range" id="wInput"><output id="wValue">0</output></label>
          <label class="oprow transform-slider"><span>Height</span><input type="range" id="hInput"><output id="hValue">0</output></label>
          <div class="transform-caption">Aspect Ratio <button class="btn" id="aspectLock" aria-label="Unlock aspect ratio" title="Unlock aspect ratio"></button></div>
          <label class="oprow transform-slider"><span>X</span><input type="range" id="xInput"><output id="xValue">0</output></label>
          <label class="oprow transform-slider"><span>Y</span><input type="range" id="yInput"><output id="yValue">0</output></label>
          <label class="oprow transform-slider"><span>Rotation</span><input type="range" id="rotationInput" min="-180" max="180" step="1"><output id="rotationValue">0°</output><button class="btn" id="resetRotation" type="button" title="Reset rotation" aria-label="Reset rotation">Reset</button></label>
          <label class="oprow">Opacity <input type="range" id="opacity" min="0" max="100" value="100"><span id="opacityValue">100%</span></label>
        </div>
      </div>
    </aside>
  </div>
</div>
<div class="layer-drop-line" id="layerDropLine" aria-hidden="true"></div>
<input type="file" id="fileInput" accept="image/*" multiple>
<input type="file" id="projectInput" accept=".json,application/json">
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="copy-fallback" id="copyFallback" role="dialog" aria-modal="true" aria-labelledby="copyFallbackTitle">
  <div class="copy-card">
    <strong id="copyFallbackTitle">Copy image manually</strong>
    <p>Long-press the image below and choose Copy Image, then paste it into WhatsApp. You can also save it and share from Photos.</p>
    <div class="copy-preview"><img id="copyPreview" alt="Full canvas PNG; long-press to copy"></div>
    <button class="btn" id="copyFallbackSave">Save</button>
    <button class="btn subtle" id="copyFallbackClose">Back to canvas</button>
  </div>
</div>
<script>
(() => {
  'use strict';

      request.onsuccess=()=>resolve(request.result);
      request.onerror=()=>reject(request.error);
    }));
  }
  async function draftTransaction(mode,action) {
    const db=await draftDB();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction('drafts',mode), request=action(tx.objectStore('drafts'));
      tx.oncomplete=()=>resolve(request.result);
      tx.onerror=()=>reject(tx.error||request.error);
      tx.onabort=()=>reject(tx.error||new Error('Save interrupted'));
    });
  }
  function queueAutosave() {
    if(!autosaveReady) return;
    autosaveDirty=true;
    clearTimeout(autosaveTimer);
    autosaveTimer=setTimeout(flushAutosave,800);
  }
  async function flushAutosave() {
    if(!autosaveReady||!autosaveDirty||autosaveBusy) return;
    autosaveBusy=true; autosaveDirty=false;
    try {
      const data=JSON.stringify(projectData());
      if(data!==lastSavedDraft) {
        await draftTransaction('readwrite',store=>store.put({data,time:Date.now()},'latest'));
        lastSavedDraft=data;
      }
    } catch(err) {console.warn('Autosave failed',err);}
    finally {autosaveBusy=false;if(autosaveDirty) queueAutosave();}
  }
  async function restoreAutosave() {
    try {
      const saved=await draftTransaction('readonly',store=>store.get('latest'));
      if(saved?.data) {
        const data=JSON.parse(saved.data);
        if(data.layers?.length) {
          if(confirm('A saved canvas was found ('+new Date(saved.time).toLocaleString()+'). Restore it?')) {
            const count=await loadProject(data);
            history=[snapshot()]; historyIndex=0; refreshHistory();
            lastSavedDraft=saved.data;
            message('Restored '+count+' layers from autosave');
          } else await draftTransaction('readwrite',store=>store.delete('latest'));
        } else {
          if(validCanvasSize(data.width,data.height)) {applyCanvasSize(data.width,data.height);update();}
          lastSavedDraft=saved.data;
        }
      }
    } catch(err) {console.warn('Recovery unavailable',err);}
    finally {autosaveReady=true;}
  }
  function toggleProjectMenu(open) {
    if(open) toggleRatioMenu(false);
    $('projectMenu').hidden=!open;
    $('projectMenuButton').setAttribute('aria-expanded',String(open));
  }
  function toggleRatioMenu(open) {
    if(open) toggleProjectMenu(false);
    $('ratioMenu').hidden=!open;
    $('ratioMenuButton').setAttribute('aria-expanded',String(open));
    if(!open) $('customSize').hidden=true;
  }
  async function addFiles(files) {
    let count=0;
    for(const file of files) {
      if(!file.type.startsWith('image/')) {message('Choose an image file, such as PNG or JPG');continue;}
      try {
        const sourceDataURL=await imageDataFromFile(file);
        const {img,thumb}=await imageFromDataURL(sourceDataURL);
        const first=layers.length===0;
        const limitW=first?W:W*.82;
        const limitH=first?H:H*.72;
        const ratio=Math.min(limitW/img.naturalWidth,limitH/img.naturalHeight);
        const w=Math.max(1,Math.round(img.naturalWidth*ratio)), h=Math.max(1,Math.round(img.naturalHeight*ratio));
        const x=Math.round((W-w)/2), y=Math.round((H-h)/2);
        const layer={id:nextId++,name:file.name||'Pasted image',img,thumb,sourceDataURL,x,y,w,h,opacity:1,visible:true,locked:false,aspectLocked:true,rotation:0};
        layers.push(layer); selectedId=layer.id; commit(); update(); count++;
      } catch(err) { message('Could not read image: '+(file.name||'unknown file')); }
    }
    if(count) message('Added '+count+' layers');
  }
  function point(e) {
    const rect=board.getBoundingClientRect();
    return {x:(e.clientX-rect.left)/viewScale,y:(e.clientY-rect.top)/viewScale};
  }
  function hit(x,y) {
    for(let i=layers.length-1;i>=0;i--) {
      const l=layers[i];
      if(!l.visible) continue;
      const angle=radians(l), c=Math.cos(angle), s=Math.sin(angle);
      const cx=l.x+l.w/2, cy=l.y+l.h/2, dx=x-cx, dy=y-cy;
      const localX=cx+dx*c+dy*s, localY=cy-dx*s+dy*c;
      if(localX<l.x||localX>l.x+l.w||localY<l.y||localY>l.y+l.h) continue;
      sampleCtx.clearRect(0,0,1,1);
      sampleCtx.drawImage(l.img,-(localX-l.x),-(localY-l.y),l.w,l.h);
      if(sampleCtx.getImageData(0,0,1,1).data[3]>8) return l;
    }
    return null;
  }
  function onPointerDown(e) {
    if(pointerState||(e.button!==undefined&&e.button!==0)) return;
    const p=point(e), handle=e.target.dataset.handle;
    let l=current();
    if(!handle) { l=hit(p.x,p.y); selectedId=l?l.id:null; update(); }
    if(!l||l.locked) return;
    const box=rotatedBounds(l);
    pointerState={id:l.id,pointerId:e.pointerId,kind:handle||'move',start:p,
      original:{x:l.x,y:l.y,w:l.w,h:l.h,rotation:l.rotation||0},startBoundsX:box.x,startBoundsY:box.y,
      originalBoundsW:box.w,originalBoundsH:box.h,
      snapX:null,snapY:null,resizeSnap:null,resizeX:null,resizeY:null,changed:false};
    board.setPointerCapture(e.pointerId); e.preventDefault();
  }
  function onPointerMove(e) {
    const s=pointerState; if(!s||e.pointerId!==s.pointerId) return;
    const l=layers.find(item=>item.id===s.id); if(!l) return;
    const p=point(e), o=s.original;
    if(s.kind==='move') {
      const box=rotatedBounds(o), offsetX=box.x-o.x, offsetY=box.y-o.y;
      const x=snapAxis(box.x+p.x-s.start.x,box.w,W,'snapX',s);
      const y=snapAxis(box.y+p.y-s.start.y,box.h,H,'snapY',s);
      l.x=Math.round(x.value-offsetX); l.y=Math.round(y.value-offsetY);
      showGuides(x.guide,y.guide);
    } else {
      const left=s.kind.includes('w'), top=s.kind.includes('n');
      const cx=o.x+o.w/2, cy=o.y+o.h/2;
      const angle=radians(o), c=Math.cos(angle), sn=Math.sin(angle);
      const dx=p.x-s.start.x, dy=p.y-s.start.y;
      const localDx=dx*c+dy*sn, localDy=-dx*sn+dy*c;
      let w=Math.max(12,o.w+2*localDx*(left?-1:1));
      let h=Math.max(12,o.h+2*localDy*(top?-1:1));
      let snappedX=false, snappedY=false;
      if(e.shiftKey ? l.aspectLocked===false : l.aspectLocked!==false) {
        s.resizeX=s.resizeY=null;
        const rawScale=Math.max(12/Math.min(o.w,o.h),Math.abs(w/o.w-1)>Math.abs(h/o.h-1)?w/o.w:h/o.h);
        const bounds=rotatedBounds(o);
        const snapOriginal={...o,x:cx-bounds.w/2,y:cy-bounds.h/2,w:bounds.w,h:bounds.h};
        const result=snapResizeScale(rawScale,snapOriginal,s);
        w=o.w*result.scale; h=o.h*result.scale;
        snappedX=result.axis==='x'; snappedY=result.axis==='y';
      } else {
        s.resizeSnap=null;
        if(Math.abs(o.rotation)<.001) {
          const x=snapResizeExtent(w,cx,W,'resizeX',s), y=snapResizeExtent(h,cy,H,'resizeY',s);
          w=x.value; h=y.value; snappedX=x.snapped; snappedY=y.snapped;
        } else {
          const ac=Math.abs(c), as=Math.abs(sn);
          const extentX=ac*w+as*h, extentY=as*w+ac*h;
          const x=snapResizeExtent(extentX,cx,W,'resizeX',s);
          const y=snapResizeExtent(extentY,cy,H,'resizeY',s);
          snappedX=x.snapped; snappedY=y.snapped;
          const det=ac*ac-as*as;
          let both=false;
          if(snappedX&&snappedY&&Math.abs(det)>.15) {
            const nextW=(ac*x.value-as*y.value)/det, nextH=(ac*y.value-as*x.value)/det;
            if(nextW>=12&&nextH>=12) {w=nextW;h=nextH;both=true;}
          }
          if(!both&&snappedX&&snappedY) {
            if(Math.abs(x.value-extentX)<=Math.abs(y.value-extentY)) snappedY=false;
            else snappedX=false;
          }
          if(!both&&snappedX) {
            if(ac>=as) w=Math.max(12,(x.value-as*h)/ac);
            else h=Math.max(12,(x.value-ac*w)/as);
          }
          if(!both&&snappedY) {
            if(ac>=as) h=Math.max(12,(y.value-as*w)/ac);
            else w=Math.max(12,(y.value-ac*h)/as);
          }
        }
      }
      l.w=w; l.h=h; l.x=cx-w/2; l.y=cy-h/2;
      showResizeGuides(l,snappedX,snappedY);
    }
    s.changed=s.changed||l.x!==o.x||l.y!==o.y||l.w!==o.w||l.h!==o.h;
    render(); drawSelection();
    e.preventDefault();
  }
  function onPointerUp(e) {
    if(pointerState&&e.pointerId!==pointerState.pointerId) return;
    if(pointerState?.changed) { commit(); update(); }
    hideGuides();
    pointerState=null;
  }
  function fullSizeExportCanvas(psCompatible=false) {
    const output=document.createElement('canvas');
    output.width=W; output.height=H;
    const outCtx=output.getContext('2d');
    paintComposite(outCtx);
    if(psCompatible) {
      for(const [x,y] of [[0,0],[W-1,H-1]]) {
        const pixel=outCtx.getImageData(x,y,1,1);
        if(pixel.data[3]===0) {
          pixel.data[0]=pixel.data[1]=pixel.data[2]=255;
          pixel.data[3]=3;
          outCtx.putImageData(pixel,x,y);
        }
      }
    }
    return output;
  }
  function exportBlob() {
    return new Promise((resolve,reject)=>fullSizeExportCanvas().toBlob(blob=>blob?resolve(blob):reject(new Error('PNG export failed')),'image/png'));
  }
  function exportBlobNow(psCompatible=false) {
    // Keep clipboard.write and navigator.share in the same tap, even on iOS Safari.
    const data=fullSizeExportCanvas(psCompatible).toDataURL('image/png').split(',')[1], binary=atob(data), bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    return new Blob([bytes],{type:'image/png'});
  }
  function closeCopyFallback() {
    $('copyFallback').classList.remove('open');
    $('copyPreview').removeAttribute('src');
    if(previewURL) URL.revokeObjectURL(previewURL);
    previewURL=null;
  }
  function showCopyFallback(blob) {
    if(previewURL) URL.revokeObjectURL(previewURL);
    previewURL=URL.createObjectURL(blob);
    $('copyPreview').src=previewURL;
    $('copyFallback').classList.add('open');
  }
  async function savePNG() {
    try {
      const blob=await exportBlob(), url=URL.createObjectURL(blob);
      const link=document.createElement('a'); link.href=url; link.download='canvas_'+W+'x'+H+'.png'; document.body.append(link); link.click(); link.remove();
      setTimeout(()=>URL.revokeObjectURL(url),60000); message('Saved '+W+' × '+H+' PNG');
    } catch(e) {message('Save failed. Please try again.');}
  }
  function copyPNG() {
    let blob;
    try {blob=exportBlobNow(true);} catch(e) {message('PNG creation failed. Use Save.');return;}
    if(!navigator.clipboard?.write||!window.ClipboardItem) {showCopyFallback(blob);return;}
    try {
      // The canvas is the complete composition. WebKit expects
      // the image representation as a Promise while write starts in this tap.
      const item=new ClipboardItem({'image/png':Promise.resolve(blob)});
      navigator.clipboard.write([item])
        .then(()=>message('Copied full '+W+' × '+H+' PNG'))
        .catch(()=>showCopyFallback(blob));
    } catch(e) {showCopyFallback(blob);}
  }
  function changeOrder(direction) {
    const i=layers.findIndex(l=>l.id===selectedId), j=i+direction;
    if(i<0||j<0||j>=layers.length||layers[i].locked) return;
    [layers[i],layers[j]]=[layers[j],layers[i]]; commit(); update();
  }
  function editTransform(key,raw) {
    const l=current();
    if(!l||l.locked) return false;
    const value=Number(raw);
    if(!Number.isFinite(value)||((key==='w'||key==='h')&&(value<1||value>20000))) return false;
    if(Math.abs(l[key]-value)<.001) return false;
    if(key==='x'||key==='y') l[key]=value;
    else {
      const cx=l.x+l.w/2, cy=l.y+l.h/2;
      if(l.aspectLocked!==false) {
        const scale=value/l[key];
        if(l.w*scale>20000||l.h*scale>20000) return false;
        l.w*=scale; l.h*=scale;
      } else l[key]=value;
      l.x=cx-l.w/2; l.y=cy-l.h/2;
    }
    return true;
  }
  $('opacity').addEventListener('input',e=>{const l=current();if(!l||l.locked)return;l.opacity=Number(e.target.value)/100;$('opacityValue').textContent=e.target.value+'%';render();});
  $('opacity').addEventListener('change',()=>{if(current()){commit();update();}});
  $('rotationInput').addEventListener('input',e=>{
    const l=current();if(!l||l.locked)return;
    l.rotation=Number(e.target.value);
    $('rotationValue').textContent=l.rotation+'°';
    render();drawSelection();
  });
  $('rotationInput').addEventListener('change',()=>{if(current()){commit();update();}});
  $('resetRotation').onclick=()=>{const l=current();if(!l||l.locked||Math.abs(l.rotation||0)<.001)return;l.rotation=0;commit();update();};
  for(const key of ['x','y','w','h']) {
    const input=$(key+'Input');
    input.addEventListener('input',()=>{
      if(editTransform(key,input.value)) {syncTransformControls(current(),false);render();drawSelection();}
      else syncTransformControls(current(),false);
    });
    input.addEventListener('change',()=>{if(current()){commit();update();}});
  }
  $('aspectLock').onclick=()=>{const l=current();if(!l||l.locked)return;l.aspectLocked=l.aspectLocked===false;commit();update();};
  $('fileInput').addEventListener('change',e=>addFiles([...e.target.files]));
  $('projectInput').addEventListener('change',e=>importProject(e.target.files[0]));
  $('projectMenuButton').onclick=()=>toggleProjectMenu($('projectMenu').hidden);
  $('ratioMenuButton').onclick=()=>{
    const now=Date.now();
    if(now-lastRatioTap<420) {lastRatioTap=0;setCanvasSize(H,W,true);}
    else {lastRatioTap=now;toggleRatioMenu($('ratioMenu').hidden);}
  };
  $('ratioMenu').querySelectorAll('[data-ratio]').forEach(button=>button.onclick=()=>{
    const dimensions={'9:16':[1080,1920],'3:4':[1080,1440],'1:1':[1080,1080]};
    setCanvasSize(...dimensions[button.dataset.ratio]);
  });
  $('customRatioButton').onclick=()=>{$('customSize').hidden=!$('customSize').hidden;if(!$('customSize').hidden)$('customWidth').focus();};
  $('applyCustomSize').onclick=()=>setCanvasSize(Number($('customWidth').value),Number($('customHeight').value));
  $('addEmpPreset').onclick=addEmpPreset;
  $('exportProject').onclick=()=>{toggleProjectMenu(false);exportProject();};
  $('importProject').onclick=()=>{toggleProjectMenu(false);$('projectInput').value='';$('projectInput').click();};
  document.addEventListener('pointerdown',e=>{
    if(!e.target.closest('#projectMenu,#projectMenuButton'))toggleProjectMenu(false);
    if(!e.target.closest('#ratioMenu,#ratioMenuButton'))toggleRatioMenu(false);
  });
  $('addImage').onclick=pickFiles;
  $('undo').onclick=()=>restore(historyIndex-1); $('redo').onclick=()=>restore(historyIndex+1);
  $('mobileUndo').onclick=$('undo').onclick; $('mobileRedo').onclick=$('redo').onclick;
  $('editToggle').onclick=()=>{side.classList.toggle('expanded');renderProperties();};
  $('copy').onclick=copyPNG; $('save').onclick=savePNG;
  $('copyFallbackSave').onclick=savePNG;
  $('copyFallbackClose').onclick=closeCopyFallback;
  $('copyFallback').onclick=e=>{if(e.target===$('copyFallback')) closeCopyFallback();};
  $('moveUp').onclick=()=>changeOrder(1); $('moveDown').onclick=()=>changeOrder(-1);
  $('centerLayer').onclick=()=>{const l=current();if(!l||l.locked)return;l.x=Math.round((W-l.w)/2);l.y=Math.round((H-l.h)/2);commit();update();};
  $('deleteLayer').onclick=()=>{const l=current();if(!l||l.locked)return;layers=layers.filter(item=>item.id!==selectedId);selectedId=layers.at(-1)?.id??null;commit();update();};
  const layerList=$('layers');
  layerList.addEventListener('contextmenu',e=>{
    if(window.innerWidth<=760&&!e.target.closest('.rename-input')) e.preventDefault();
  });

    if(Date.now()<suppressLayerClickUntil) {e.preventDefault();e.stopImmediatePropagation();}
  },true);
  layerList.addEventListener('touchstart',e=>{
    if(window.innerWidth>760||e.touches.length!==1) return;

    if(!row||e.target.closest('button,.rename-input')) return;

      const rect=row.getBoundingClientRect(), ghost=row.cloneNode(true);

  layerList.addEventListener('touchmove',e=>{
    if(!mobileDrag) return;
    const touch=mobileTouch(e,mobileDrag.touchId);
    if(!touch) return;
    if(!mobileDrag.active) {
      if(Math.hypot(touch.clientX-mobileDrag.x,touch.clientY-mobileDrag.y)>9) finishMobileDrag();

    }

  layerList.addEventListener('touchend',e=>{

    const target=mobileDropTarget(mobileTouch(e,mobileDrag.touchId,true).clientX), sourceId=mobileDrag.id;

    showLayerDropLine(targetId,edge==='top',edge==='top'?listRect.top:listRect.bottom);
  });
  document.addEventListener('drop',e=>{
    const edge=layerEdgeTarget(e);
    if(!edge) return;
    e.preventDefault(); dropLayerAtEdge(edge);
  });
  board.addEventListener('pointerdown',onPointerDown);
  board.addEventListener('pointermove',onPointerMove);
  board.addEventListener('pointerup',onPointerUp);
  board.addEventListener('pointercancel',onPointerUp);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&!$('ratioMenu').hidden) {toggleRatioMenu(false);return;}
    if(e.key==='Escape'&&!$('projectMenu').hidden) {toggleProjectMenu(false);return;}
    if(e.key==='Escape'&&$('copyFallback').classList.contains('open')) {closeCopyFallback();return;}

    if(mod&&e.key.toLowerCase()==='z') {e.preventDefault();restore(historyIndex+(e.shiftKey?1:-1));return;}
    if(mod&&e.key.toLowerCase()==='y') {e.preventDefault();restore(historyIndex+1);return;}
    const l=current();if(!l||l.locked)return;
    if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();$('deleteLayer').click();return;}
    const shift=e.shiftKey?10:1;
    const moves={ArrowLeft:[-shift,0],ArrowRight:[shift,0],ArrowUp:[0,-shift],ArrowDown:[0,shift]};

  });

    const files=[...(e.clipboardData?.items||[])].filter(item=>item.type.startsWith('image/')).map(item=>item.getAsFile()).filter(Boolean);
    if(files.length){e.preventDefault();addFiles(files);}
  });
  stage.addEventListener('dragover',e=>{if(e.dataTransfer?.types.includes('Files')){e.preventDefault();stage.classList.add('dragging');}});
  stage.addEventListener('dragleave',e=>{if(!stage.contains(e.relatedTarget))stage.classList.remove('dragging');});
  stage.addEventListener('drop',e=>{e.preventDefault();stage.classList.remove('dragging');addFiles([...e.dataTransfer.files]);});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){autosaveDirty=true;flushAutosave();}});
  window.addEventListener('pagehide',()=>{autosaveDirty=true;flushAutosave();});
  setInterval(()=>{if(autosaveReady){autosaveDirty=true;flushAutosave();}},15000);
  new ResizeObserver(resizeView).observe(stage);
  applyCanvasSize(W,H); commit(); update(); requestAnimationFrame(resizeView);
  restoreAutosave();
})();
